    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="8s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#0B1020" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0B1020" stop-opacity="1"/>
  </radialGradient>
  <clipPath id="panel"><rect width="1000" height="320" rx="16"/></clipPath>
  
  <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#E6EDF3"/><stop offset=".42" stop-color="#E6EDF3"/>
    <stop offset=".5" stop-color="#22D3EE"/><stop offset=".58" stop-color="#E6EDF3"/><stop offset="1" stop-color="#E6EDF3"/>
