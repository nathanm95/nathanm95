  </linearGradient>
  <clipPath id="wipe"><rect x="50" y="80" width="0" height="100">
    <animate attributeName="width" to="560" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".7 0 .3 1"/></rect></clipPath>
  <linearGradient id="bar"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
